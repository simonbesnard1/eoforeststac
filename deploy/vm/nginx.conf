# Rendered tiles are deterministic: the full query string contains the Zarr
# version URL, variable, dimension selections, colour map and value range.
# Keep completed responses on VM disk so returning to a view does not repeat
# remote Zarr reads.  The bounded cache evicts inactive/old tiles itself.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=rendered_tiles:16m
                 max_size=5g inactive=7d use_temp_path=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Look the services up through Docker's DNS on each request (cached 30 s).
    # A fixed proxy_pass host is resolved once at start: when the titiler and
    # footprints containers were recreated and swapped addresses, /api/ went
    # to the footprint service until nginx restarted.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $titiler http://titiler:8000;
    set $footprints http://footprints:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://server.arcgisonline.com https://*.arcgisonline.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' https://s3.gfz.de; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Area downloads: the zip can be several GB, so stream it straight through
    # instead of spooling it into the read-only container's small tmpfs.
    location /api/download {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $titiler;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 2m;
    }

    # Spaceborne lidar footprints (GEDI, ICESat-2): a separate service. It is
    # resolved per request, so the explorer still starts when it is down.
    location /api/footprints/ {
        rewrite ^/api/footprints/(.*)$ /$1 break;
        proxy_pass $footprints;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 1m;
        # Tiles carry up to 25k points as JSON
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
    }

    # Raster tiles are expensive but immutable for their complete URL. Cache
    # only successful responses; errors and cancelled requests are never kept.
    location /api/tiles/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $titiler;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        proxy_cache rendered_tiles;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 180s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Tile-Cache $upstream_cache_status always;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $titiler;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 1m;
    }

    # The page is index.html plus js/ and css/ files: browsers must check each
    # for a newer copy (a cheap 304 when unchanged), or a deploy could pair a
    # new index.html with cached old scripts
    location / {
        expires epoch;
        try_files $uri $uri/ /index.html;
    }
}
