name: Explorer

# Start the explorer's web and tile-server containers as on the VM and drive
# the page with a browser (tests/e2e). The footprint service is left out: it
# needs the lidar databases' heavy readers, and the explorer works without it.
on:
  push:
    branches: [main]
    paths: ["webapp/**", "deploy/**", "eoforeststac/analytics.py", "tests/e2e/**", ".github/workflows/explorer.yml"]
  pull_request:
    paths: ["webapp/**", "deploy/**", "eoforeststac/analytics.py", "tests/e2e/**", ".github/workflows/explorer.yml"]
  workflow_dispatch:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Start web and TiTiler
        run: |
          docker compose -f deploy/vm/compose.yaml up -d --build --wait web titiler
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080/api/healthz

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install "playwright>=1.48,<2" "pytest>=8,<9"
          python -m playwright install --with-deps chromium

      - name: Browser tests
        env:
          BASE_URL: http://127.0.0.1:8080
        run: python -m pytest -v --confcutdir=tests/e2e tests/e2e

      - name: Container logs
        if: failure()
        run: docker compose -f deploy/vm/compose.yaml logs --tail=200 web titiler
